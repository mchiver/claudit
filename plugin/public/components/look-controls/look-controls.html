<div class="look-controls">
	<label class="look-row">
		<span>Theme</span>
		<select class="form-select form-select-sm" ng-model="$ctrl.theme" ng-change="$ctrl.SetTheme()" title="the palette; System follows the operating system"
			ng-options="palette.Id as palette.Label for palette in $ctrl.palettes"></select>
	</label>
	<label class="look-row">
		<span>Size</span>
		<select class="form-select form-select-sm" ng-model="$ctrl.scale" ng-change="$ctrl.SetScale()" title="the size of everything">
			<option value="small">Small</option>
			<option value="normal">Normal</option>
			<option value="large">Large</option>
		</select>
	</label>
	<label class="look-row">
		<span>Margins</span>
		<select class="form-select form-select-sm" ng-model="$ctrl.margins" ng-change="$ctrl.SetMargins()" title="the margins beside the events: Narrow lets them take the pane, Normal holds them to 68rem, Wide to 52rem">
			<option value="narrow">Narrow</option>
			<option value="normal">Normal</option>
			<option value="wide">Wide</option>
		</select>
	</label>
</div>
