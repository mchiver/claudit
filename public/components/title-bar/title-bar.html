<nav class="title-bar navbar px-3 py-1 border-bottom">
	<span class="navbar-brand mb-0 h1">Claudit</span>
	<span class="title-status small me-auto ms-3">
		<span class="status-dot" ng-class="{ 'is-on': $ctrl.state.connected }"></span>
		<span ng-if="$ctrl.state.connected">live</span>
		<span ng-if="!$ctrl.state.connected">not connected</span>
		<span ng-if="$ctrl.state.health" class="dim ms-2">{{ $ctrl.state.health.sessions }} sessions · port {{ $ctrl.state.health.port }}</span>
	</span>
	<button type="button" class="btn btn-sm btn-outline-secondary me-2" ng-class="{ active: $ctrl.state.engine }"
		ng-click="$ctrl.ToggleEngine()" title="Show the rows the engine appends: reminders, attachments, notices, thinking">engine rows</button>
	<button type="button" class="btn btn-sm btn-outline-secondary look-button" ng-class="{ active: $ctrl.look_open }"
		ng-click="$ctrl.ToggleLook( $event )" title="The theme, the size and the margins"><svg class="icon"><use href="#i-gear"></use></svg></button>
	<div class="look-popover" ng-if="$ctrl.look_open">
		<look-controls></look-controls>
	</div>
</nav>
