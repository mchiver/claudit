<nav class="title-bar navbar px-3 py-2 border-bottom">
	<span class="navbar-brand mb-0 h1">Claudit</span>
	<span class="title-status small me-auto ms-3">
		<span class="status-dot" ng-class="{ 'is-on': $ctrl.state.connected }"></span>
		<span ng-if="$ctrl.state.connected">live</span>
		<span ng-if="!$ctrl.state.connected">not connected</span>
		<span ng-if="$ctrl.state.health" class="dim ms-2">{{ $ctrl.state.health.sessions }} sessions · port {{ $ctrl.state.health.port }}</span>
	</span>
	<div class="bar-buttons d-flex align-items-center gap-2">
		<button type="button" class="btn btn-sm btn-outline-secondary" ng-class="{ active: $ctrl.state.engine }"
			ng-click="$ctrl.ToggleEngine()" title="Show the rows the engine appends: reminders, attachments, notices, thinking"><svg class="icon"><use href="#i-rows"></use></svg><span>engine rows</span></button>
		<button type="button" class="btn btn-sm btn-outline-secondary" ng-class="{ active: $ctrl.state.newest }"
			ng-click="$ctrl.ToggleOrder()" title="Newest turn first; off, oldest first"><svg class="icon"><use href="#i-sort"></use></svg><span>newest first</span></button>
		<button type="button" class="btn btn-sm btn-outline-secondary"
			ng-click="$ctrl.FocusLatest()" title="Close every turn but the latest and scroll to it"><svg class="icon"><use href="#i-latest"></use></svg><span>latest turn</span></button>
		<button type="button" class="btn btn-sm btn-outline-secondary look-button" ng-class="{ active: $ctrl.look_open }"
			ng-click="$ctrl.ToggleLook( $event )" title="The theme, the size and the margins"><svg class="icon"><use href="#i-gear"></use></svg></button>
	</div>
	<div class="look-popover" ng-if="$ctrl.look_open">
		<look-controls></look-controls>
	</div>
</nav>
