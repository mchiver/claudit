<div class="claudit-app d-flex flex-column">
	<title-bar></title-bar>
	<div ng-if="$ctrl.state.error" class="alert alert-warning rounded-0 mb-0 py-1 px-3 small">{{ $ctrl.state.error }}</div>
	<div class="claudit-body d-flex flex-grow-1">
		<session-list sessions="$ctrl.state.sessions" selected="$ctrl.state.selected"></session-list>
		<event-list events="$ctrl.state.events" session="$ctrl.state.session"></event-list>
	</div>
</div>
