<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Claudit</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
	<link rel="stylesheet" href="app.css">
	<link rel="stylesheet" href="components/claudit-app/claudit-app.css">
	<link rel="stylesheet" href="components/title-bar/title-bar.css">
	<link rel="stylesheet" href="components/look-controls/look-controls.css">
	<link rel="stylesheet" href="components/session-list/session-list.css">
	<link rel="stylesheet" href="components/event-list/event-list.css">
	<!-- The look is applied before the page renders. -->
	<script src="theme.js"></script>
</head>
<body ng-app="claudit">

	<!-- The icons: inline SVG symbols, drawn with <svg class="icon"><use href="#i-..."></use></svg>. -->
	<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
		<symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></symbol>
		<symbol id="i-chevron-left" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></symbol>
		<symbol id="i-chevron-right" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></symbol>
		<symbol id="i-rows" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></symbol>
		<symbol id="i-sort" viewBox="0 0 16 16"><path d="M5 13V3M2.5 5.5L5 3l2.5 2.5M11 3v10M8.5 10.5L11 13l2.5-2.5"/></symbol>
		<symbol id="i-latest" viewBox="0 0 16 16"><path d="M4 2.5l4 4 4-4M4 7.5l4 4 4-4M3 14h10"/></symbol>
	</svg>

	<claudit-app></claudit-app>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
	<script src="turns.js"></script>
	<script src="app.js"></script>
	<script src="components/claudit-app/claudit-app.js"></script>
	<script src="components/title-bar/title-bar.js"></script>
	<script src="components/look-controls/look-controls.js"></script>
	<script src="components/session-list/session-list.js"></script>
	<script src="components/event-list/event-list.js"></script>
</body>
</html>
